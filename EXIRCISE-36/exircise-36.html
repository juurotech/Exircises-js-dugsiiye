<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Color Picker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }

    .container {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    #colorInput {
      margin-top: 5px;
    }

    #colorPreview {
      width: 100%;
      height: 120px;
      margin-top: 10px;
      border: 2px solid #ccc;
      border-radius: 5px;
      background-color: white;
    }

    #colorHistory {
      margin-top: 20px;
    }

    .history-color {
      display: inline-block;
      width: 35px;
      height: 35px;
      margin: 5px;
      border: 1px solid #aaa;
      border-radius: 4px;
      cursor: pointer;
    }

    #hexCodeDisplay {
      display: block;
      margin: 10px 0;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 6px 12px;
      border: none;
      background: #800080;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #5a005a;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Interactive Color Picker</h2>

    <label>Choose a color:</label><br>
    <input type="color" id="colorInput" value="#800080">

    <div id="colorPreview"></div>

    <div id="colorHistory">
      <h3>Color History</h3>

      <span id="hexCodeDisplay"></span>

      <div id="historyContainer"></div>

      <button id="clearHistory">Clear History</button>
    </div>
  </div>

  <script src="exircise-36.js"></script>
</body>
</html>
