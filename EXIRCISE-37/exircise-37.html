<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Blog</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    .form-container {
      background: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      border-radius: 5px;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
    }

    .posts {
      max-width: 800px;
      margin: 30px auto;
    }

    .post {
      background: white;
      margin-bottom: 30px;
      border-radius: 5px;
      overflow: hidden;
    }

    .post img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .post-content {
      padding: 15px;
    }

    .actions button {
      width: auto;
      margin-right: 5px;
    }

    /* ===== POPUP ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      width: 400px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h1 style="text-align:center">Simple Blog</h1>

<div class="form-container">
  <input id="title" placeholder="Post title">
  <input id="image" placeholder="Image URL">
  <textarea id="content" placeholder="Post content"></textarea>
  <button id="submitBtn">Save Post</button>
</div>

<div class="posts" id="posts"></div>


<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Edit Post</h3>
    <input id="editTitle" placeholder="Post title">
    <input id="editImage" placeholder="Image URL">
    <textarea id="editContent" placeholder="Post content"></textarea>
    <button id="updateBtn">Update</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script src="tusale.js"></script>
</body>
</html>
